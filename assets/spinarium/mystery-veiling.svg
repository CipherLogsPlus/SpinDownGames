           C432 451 448 415 463 369
           C477 292 446 236 383 236Z"
        fill="#020405"/>
  <path d="M291 343C291 287 316 241 352 221
           C319 278 321 352 340 423
           C315 401 301 374 291 343Z"
        fill="#859ca3" opacity=".06"/>
  <path d="M476 343C476 287 451 241 416 221
           C449 278 445 352 426 423
           C451 401 465 374 476 343Z"
