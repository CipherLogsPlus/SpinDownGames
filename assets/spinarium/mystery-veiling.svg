<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="title desc">
  <title id="title">Mysterious Veiling silhouette</title>
  <desc id="desc">A faceless, shadowy figure emerges from dark mist. Artwork has not yet been revealed.</desc>
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="37%" r="73%">
      <stop offset="0" stop-color="#21303c"/>
      <stop offset=".36" stop-color="#101920"/>
      <stop offset=".75" stop-color="#080d12"/>
      <stop offset="1" stop-color="#030609"/>
    </radialGradient>
    <radialGradient id="haze" cx="50%" cy="51%" r="51%">
      <stop offset="0" stop-color="#50606b" stop-opacity=".30"/>
      <stop offset=".72" stop-color="#203440" stop-opacity=".10"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloak" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#172027"/>
      <stop offset=".45" stop-color="#060a0d"/>
      <stop offset=".78" stop-color="#0c1014"/>
      <stop offset="1" stop-color="#030506"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" x2="1">
      <stop offset="0" stop-color="#66808c" stop-opacity=".28"/>
      <stop offset=".50" stop-color="#91a9ae" stop-opacity=".08"/>
      <stop offset="1" stop-color="#6f8992" stop-opacity=".30"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset=".70" stop-color="#000" stop-opacity=".04"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="36"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>
  <rect width="768" height="1024" fill="url(#backdrop)"/>
  <ellipse cx="386" cy="510" rx="293" ry="432" fill="url(#haze)"/>
  <ellipse cx="385" cy="756" rx="248" ry="140" fill="#50636a" opacity=".12" filter="url(#blur)"/>
  <g opacity=".65" fill="none" stroke="#7a9298" stroke-width="1">
    <path d="M144 795Q385 849 625 795" opacity=".13"/>
    <path d="M201 185Q387 131 572 185" opacity=".12"/>
  </g>
  <!-- The same anonymous, faceless figure represents every Veiling with no artwork. -->
  <path d="M383 182C304 182 265 248 267 333L260 408
