name: Build reviewed Spinarium Worker for connector deployment
on:
  push:
    branches: [ops/prepare-verified-deletion-worker]
    paths: [.github/workflows/worker-build-for-connector.yml]
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/spinarium-worker/package-lock.json
      - name: Build exact tested Worker source
        working-directory: cloudflare/spinarium-worker
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -s dist/index.js
          sha256sum dist/index.js
          wc -c dist/index.js
      - name: Save bundle for authenticated Cloudflare connector
        run: |
          mkdir -p deploy-artifacts
          cp cloudflare/spinarium-worker/dist/index.js deploy-artifacts/worker-bundle.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy-artifacts/worker-bundle.js
          git commit -m 'Store reviewed Worker bundle for Cloudflare connector' 
          git push origin HEAD:ops/prepare-verified-deletion-worker
