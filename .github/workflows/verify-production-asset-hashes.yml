name: Verify production asset hashes (no deployment)
on:
  push:
    branches:
      - ops/verify-production-static-assets-20261029
jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calculate current production asset manifest
        run: |
          python3 - <<'PY'
          import pathlib, hashlib, json
          root=pathlib.Path(".")
          roots=["index.html","privacy.html","terms.html","styles.css","legal.css","script.js","coin-viewer.js"]
          artwork_ext={".webp",".png",".jpg",".jpeg",".svg",".ttf",".woff",".woff2",".glb"}
          site_ext={".html",".css",".js"}
          retired={"spinarium/auth/supabase-auth.js","spinarium/data/supabase-service.js","spinarium/data/demo-service.js","spinarium/config.js"}
          files={}
          for x in roots: files[x]=pathlib.Path(x).read_bytes()
          for p in pathlib.Path("assets").rglob("*"):
              if p.is_file() and not any(s.startswith(".") for s in p.parts) and (p.suffix in artwork_ext or (p.parent==pathlib.Path("assets/fonts") and p.suffix==".txt")): files[p.as_posix()]=p.read_bytes()
          for p in pathlib.Path("spinarium").rglob("*"):
              if p.is_file() and not any(s.startswith(".") for s in p.parts) and p.suffix in site_ext and p.as_posix() not in retired: files[p.as_posix()]=p.read_bytes()
          config={'previewEnabled':False,'backend':'cloudflare','authProvider':'password','signupEnabled':True,'apiBase':'/api','supabaseUrl':'','supabasePublishableKey':''}
          files["spinarium/config.js"]=("// Generated production public switches. Contains no credentials.\\nexport const spinariumConfig = Object.freeze("+json.dumps(config,indent=2)+");\\n").encode()
          files["_headers"]=("/*\\n  X-Content-Type-Options: nosniff\\n  X-Frame-Options: DENY\\n  Referrer-Policy: strict-origin-when-cross-origin\\n/spinarium/config.js\\n  Cache-Control: no-store\\n").encode()
          manifest={"/"+p:{"hash":hashlib.sha256(data).hexdigest()[:32],"size":len(data)} for p,data in sorted(files.items())}
          print("ASSET_MANIFEST_JSON="+json.dumps(manifest,separators=(",",":")))
          print("ASSET_TOTAL="+str(len(manifest)))
          PY

      - name: Verify live Cloudflare routing, main website and Spinarium
        run: |
          set -eu
          BASE=https://spindowngames.com
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --output /tmp/website.html "$BASE/"
          grep -q 'No upcoming events announced' /tmp/website.html
          grep -q 'data-event-end="2026-10-18"' /tmp/website.html
          echo "PASS homepage uses updated events markup"
          curl --fail --silent --show-error --output /tmp/site-script.js "$BASE/script.js?v=event-directions-1"
          grep -q 'updateEventDisplay' /tmp/site-script.js
          echo "PASS website JavaScript uses automatic archiving"
          curl --fail --silent --show-error --output /tmp/site-styles.css "$BASE/styles.css?v=trademark-1"
          grep -q 'upcoming-events' /tmp/site-styles.css
          echo "PASS website stylesheet updated"
          curl --fail --silent --show-error --output /tmp/health.json "$BASE/api/health"
          python3 -c 'import json; x=json.load(open("/tmp/health.json")); assert x["service"]=="spinarium" and x["accountsEnabled"] is True and x["claimsEnabled"] is False'
          echo "PASS Spinarium API enabled"
          curl --fail --silent --show-error --output /tmp/spinarium.html "$BASE/spinarium/"
          grep -q 'Spinarium' /tmp/spinarium.html
          echo "PASS Spinarium frontend available"
          curl --fail --silent --show-error --output /tmp/config.js "$BASE/spinarium/config.js"
          grep -q 'previewEnabled' /tmp/config.js
          grep -q 'signupEnabled' /tmp/config.js
          echo "PASS Spinarium account config available"

          curl --fail --silent --show-error --retry 5 --retry-delay 2 --output /tmp/deletion-studio.js "$BASE/spinarium/components/veiling-studio.js?release=20261029-delete"
          grep -q 'Yes, delete Veiling' /tmp/deletion-studio.js
          grep -q 'Unpublish this Veiling before deleting it' /tmp/deletion-studio.js
          echo "PASS live Studio exposes confirmed deletion with unpublish prerequisite"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --output /tmp/deletion-style.css "$BASE/spinarium/veiling-studio.css?release=20261029-delete"
          grep -q 'studio-delete-dialog' /tmp/deletion-style.css
          echo "PASS live Studio deletion styling published"
          STATUS=$(curl --silent --show-error --output /tmp/delete-unauthorized.json --write-out '%{http_code}' -X DELETE "$BASE/api/admin/veilings/00000000-0000-4000-8000-000000000000")
          test "$STATUS" = 401
          python3 -c 'import json; assert json.load(open("/tmp/delete-unauthorized.json"))["code"] == "UNAUTHORIZED"'
          echo "PASS live deletion endpoint rejects unauthenticated calls"


          curl --fail --silent --show-error --retry 5 --retry-delay 2 --output /tmp/studio.html "$BASE/spinarium/"
          grep -q 'Create a Veiling in two steps' /tmp/studio.html
          echo "PASS Veiling Studio HTML has redesigned introduction"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --output /tmp/studio-js "$BASE/spinarium/components/veiling-studio.js?verify=20261029"
          grep -q 'Bring your next Veiling to life' /tmp/studio-js
          grep -q 'studio-essentials' /tmp/studio-js
          echo "PASS Veiling Studio JavaScript is redesigned"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --output /tmp/studio-css "$BASE/spinarium/veiling-studio.css?verify=20261029"
          grep -q 'Focused create-first workspace' /tmp/studio-css
          echo "PASS Veiling Studio styles are redesigned"

